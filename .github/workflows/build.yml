name: Build & Release MHS Download Manager

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64-installer:
    name: Build Windows x64 Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile mdm.exe & Setup Installer via build.ps1
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Stage Official Setup Installer & SHA-256 Manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-dist" | Out-Null

          $TagVer = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'v1.0.0' }
          $VerClean = $TagVer.TrimStart('v')
          $SetupFileName = "MHS-Download-Manager-Setup-$VerClean-x64.exe"

          $BuiltSetup = Join-Path $PWD "bin\MHS-Download-Manager-Setup-1.0.0-x64.exe"
          $StagedSetup = Join-Path $PWD "release-dist\$SetupFileName"
          Copy-Item -LiteralPath $BuiltSetup -Destination $StagedSetup -Force

          $SetupSha = (Get-FileHash -LiteralPath $StagedSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $PWD "release-dist\SHA256SUMS.txt") -Value "$SetupSha  $SetupFileName" -Encoding UTF8

          $NotesLines = @(
            "## MHS Download Manager $TagVer — Official Windows x64 Installer (Mehedi Hasan Shihab)",
            "",
            "Download and run **``$SetupFileName``** to install **MHS Download Manager 1.0.0 (Mehedi Hasan Shihab)** along with its ready-to-load **``extension``** folder inside your installation directory.",
            "",
            "### What the Setup Installer Creates in Your Installation Directory",
            "- **``mdm.exe``** — MHS Download Manager 1.0.0 (x64 Windows Desktop Application)",
            "- **``extension\``** — Complete unpacked Browser Extension folder inside the installation directory for **Google Chrome**, **Brave**, and **Microsoft Edge**",
            "- **``Uninstall.exe``** — Clean Windows Uninstaller + *Installed Apps* registration, Desktop shortcut, Start Menu shortcuts, and Startup/Native Messaging integration",
            "",
            "### Loading the Browser Extension After Installation (Chrome / Brave / Edge)",
            "1. Run **``$SetupFileName``** and complete the Setup Wizard (at the final step, Setup automatically copies the installed ``extension`` folder path and can open it directly in File Explorer; you can also open it anytime via **``Help -> Open Browser Extension Folder``**).",
            "2. Open ``chrome://extensions`` (Chrome) or ``brave://extensions`` (Brave) or ``edge://extensions`` (Edge).",
            "3. Enable **Developer mode** (top-right).",
            "4. Click **Load unpacked** and select the **``extension``** folder inside your installation directory (default: ``%LOCALAPPDATA%\Programs\MHS Download Manager\extension``).",
            "",
            "### Latest Features Included",
            "- **Obsidian-Violet Dark Theme (``v1.0.0``)**: Pitch-dark DWM window frames, native dark scrollbars, live search bar, rounded purple-accent cards, ``40px`` borderless rows with inline cyan-to-violet progress bars, and ``MHS Download Manager 1.0.0 (Mehedi Hasan Shihab)`` header branding across all windows and dialogs.",
            "- **High-Speed YouTube HD/4K & Unthrottled Companion Audio**: Direct InnerTube stream resolution (``144p`` up to ``1080p``/``1440p``/``2160p 4K`` + original ``M4A``/``Opus`` audio) paired with parallel burst-sliced HTTP ``206`` range workers (``1 MiB`` audio / ``4 MiB`` video slices over warm ``KeepAlive`` TLS sockets) so both large videos and long companion audio tracks finish in seconds with live ``Transfer rate`` and ``Time left``.",
            "- **Exact Selected-Video Tracking & Compact Corner Bar (``↻``)**: Icon-only floating video widget (``[MHS Icon] [1080p · N] | [↻] [▾] [×]``) with one-click Reloader (``↻``) that isolates strictly the selected video on Facebook, Instagram, YouTube, X, TikTok, Reddit, and HTML5 players with exact video captions/titles, resolutions, ``VIDEO``/``AUDIO`` badges, and file sizes.",
            "- **Zero-Dependency Lossless Video + Audio Muxing**: Built-in C# ISO-BMFF & Matroska muxer (``MP4/fMP4 + M4A -> Fast-Start .mp4``, ``MP4 + WebM Opus -> .mp4``, ``WebM + WebM -> .webm``, ``WebM + M4A -> .mkv``) guaranteeing full audio on adaptive streams while respecting DRM protections.",
            "- **Automatic Browser Download Interception**: Captures direct and tokenized/redirect downloads (``.mkv``, ``.mp4``, ``.zip``, ``.rar``, ``R0*``, ``.exe``, ``.iso``, etc.) via ``chrome.downloads`` + ``Content-Disposition`` filename resolution, plus automatic Browser Fetch Relay recovery on session-bound ``403`` streams.",
            "- **Full Download Management Suite**: Dynamic in-flight segment splitting (``1–32`` connections), Pause/Resume, Per-Item & Global Speed Limiter, Queues, Scheduler, Site Grabber spider, Batch Download, ``.ef2``/``.txt`` Import & Export, 9-Tab Options dialog, System Tray integration, and Native Messaging host (``com.shihab.mehedi.idm``).",
            "",
            "### SHA-256 Checksum",
            "| Installer File | SHA-256 |",
            "| :--- | :--- |",
            "| ``$SetupFileName`` | ``$SetupSha`` |"
          )
          Set-Content -Path (Join-Path $PWD "release-dist\RELEASE_NOTES.md") -Value ($NotesLines -join "`r`n") -Encoding UTF8

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHS-Download-Manager-Setup-Windows-x64
          path: |
            release-dist/MHS-Download-Manager-Setup-*-x64.exe
            release-dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove Previous Release Entry for Tag (if re-releasing)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "${{ github.ref_name }}" --yes
          }
          $global:LASTEXITCODE = 0

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "MHS Download Manager ${{ github.ref_name }} (Mehedi Hasan Shihab)"
          body_path: release-dist/RELEASE_NOTES.md
          make_latest: "true"
          files: |
            release-dist/MHS-Download-Manager-Setup-*-x64.exe
            release-dist/SHA256SUMS.txt
