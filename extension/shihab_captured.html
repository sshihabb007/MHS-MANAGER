<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Download Transferred — MHS Download Manager</title>
  <script src="mehedi_captured.js" defer></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .shihab-card {
      max-width: 540px;
      padding: 32px 36px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid rgba(96, 165, 250, 0.4);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .mehedi-hero-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    h2 { margin: 0 0 12px; color: #60a5fa; }
    p { margin: 0 0 22px; color: #cbd5e1; line-height: 1.5; }
    button {
      background: linear-gradient(135deg, #2563eb, #db2777);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font: 600 13px 'Segoe UI', sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shihab-card">
    <img src="images/shihab_logo128.png" alt="MHS Download Manager" class="mehedi-hero-logo" />
    <h2>MHS Download Manager</h2>
    <p id="shihabTransferredText">File download has been transferred to MHS Download Manager (mdm.exe).</p>
    <button id="mehediBackButton">← Return to Previous Page</button>
  </div>
</body>
</html>
